<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id & Classes in HTML </title>
    <style>
        body{
            background-color: rgb(87, 20, 138);
        }
        #some{
            color: aqua;
        }
        .Second{
            color: red;
        
        }
    </style>
</head>

    <div id="some">This is a div</div>
    <span class="Second">Second</span>

</body>
</html>
